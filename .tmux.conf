# ========== Plugins ============
# TPM
set -g @plugin 'tmux-plugins/tpm'

# Save and restore tmux sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Automatic save/restore
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Bottom window tabs
set -g @plugin 'catppuccin/tmux#v2.3.2'
set -g @catppuccin_flavor 'mocha'
# Catppuccin styles panes and messages. Tabs are drawn below so the corners stay transparent.
set -g @catppuccin_window_status_style 'none'
set -g @catppuccin_status_background 'none'


# ========== MySetup ============
# Set prefix
set -g prefix C-p
unbind C-b
bind C-p send-prefix

# Mark text in copy mode with Ctrl-m instead of Ctrl-Space.
# With extended-keys off, tmux treats Ctrl-m and Enter as the same key.
unbind -T copy-mode -q C-Space
bind -T copy-mode C-m send-keys -X begin-selection

# Split window
unbind-key '"'
unbind-key %

bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"


# Resize panes using Shift + arrows
bind -n S-Left resize-pane -L 1
bind -n S-Right resize-pane -R 1
bind -n S-Up resize-pane -U 1
bind -n S-Down resize-pane -D 1


# Window tabs along the bottom, left to right
set -g status-position bottom
set -g status-justify left


# Synchronize toggle
bind s set-window-option synchronize-panes \; display-message "sync toggled"


# Initialize TPM (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

# Rounded pills. The curve is the same colour as the pill; the cell behind it is the terminal background.
# ##I and ##W survive the one format pass from -F and become #I and #W.
set -gF status-style "bg=terminal,fg=#{@thm_fg}"
set -g status-left-style "bg=terminal"
set -g status-right-style "bg=terminal"
set -g window-status-separator " "
set -gF window-status-style "fg=#{@thm_fg},bg=terminal"
set -gF window-status-current-style "fg=#{@thm_crust},bg=terminal"
set -gF window-status-activity-style "fg=#{@thm_yellow},bg=terminal"
set -gF window-status-bell-style "fg=#{@thm_red},bg=terminal"
set -gF window-status-format "#[fg=#{@thm_surface_0},bg=terminal]#[fg=#{@thm_fg},bg=#{@thm_surface_0}] ##I ##W #[fg=#{@thm_surface_0},bg=terminal]"
set -gF window-status-current-format "#[fg=#{@thm_mauve},bg=terminal]#[fg=#{@thm_crust},bg=#{@thm_mauve}] ##I ##W #[fg=#{@thm_mauve},bg=terminal]"
